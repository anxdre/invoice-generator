version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: invoice_app
        volumes:
            - .:/var/www
            - ./database:/var/www/database
        working_dir: /var/www
        networks:
            - invoice_net

    nginx:
        image: nginx:alpine
        container_name: invoice_nginx
        ports:
            - "8101:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - invoice_net

networks:
    invoice_net:
        driver: bridge
